      - Own the on-call rotation and incident-response process for the payments platform; introduced structured postmortems and reduced repeat incidents by 60% over two quarters.
      - Drove the team's migration from EC2 to Kubernetes (EKS), including writing the internal runbooks and training four engineers who'd never used Kubernetes before.
      - Partner directly with Product and Compliance to scope HIPAA-sensitive data-handling requirements before implementation starts, not after.

  - company: Lighthouse Analytics
    title: Senior Software Engineer
    location: Remote
    start: Jul 2020
    end: Feb 2023
    bullets:
      - Built the core ingestion pipeline for a real-time analytics product processing 50M+ events/day, using Kafka and Python (asyncio).
      - Designed and shipped a multi-tenant permissions system used by every downstream service in the company, replacing a patchwork of ad-hoc checks.
      - Mentored two junior engineers through their first year, both of whom were promoted to mid-level within 18 months.
      - Reduced average API p99 latency by 45% by identifying and fixing N+1 query patterns across the service layer.

  - company: Lighthouse Analytics
    title: Software Engineer
    location: Remote
    start: Aug 2018
    end: Jun 2020
    bullets:
      - Joined as the third engineer on the founding team; built the original MVP's backend (Django) that the company's first 200 customers ran on.
      - Implemented the company's first automated testing and CI/CD pipeline (GitHub Actions), reducing deploy time from a 45-minute manual process to under 5 minutes.

  - company: CampusEats
    title: Software Engineering Intern
    location: Boulder, CO
    start: May 2017
    end: Aug 2017
