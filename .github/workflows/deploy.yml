name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Digital Ocean droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/resume
            git pull origin main
            source venv/bin/activate
            pip install -q -r requirements.txt
            # Browser binary only -- no root needed, safe for the deploy user.
            # OS-level shared libs (`playwright install-deps`) are a one-time
            # setup step run by hand with real sudo, see README.md.
            playwright install chromium
            alembic upgrade head
            python build.py
            sudo systemctl restart resume
            sudo systemctl restart resume-admin
