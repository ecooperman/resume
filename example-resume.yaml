# Example resume.yaml - a fully-populated, fictional reference showing
# every field this app's rendering pipeline understands. Copy this file,
# replace the content with your own real information, and paste the result
# into the admin UI's "Add person" form (see README.md's "Editing your
# resume" and "Constructing your resume.yaml" sections) - it only requires
# a top-level `basics` key, matching this shape.
#
# Don't feel obligated to trim this down to "resume length" yourself before
# pasting it in - see the README for why it's worth including *more* than
# you'd ever put on a single printed page.

basics:
  name: Jordan Rivera
  title: Senior Software Engineer
  email: jordan.rivera@example.com
  phone: "555.123.4567"
  location: Denver, CO (Remote)
  # Bare hostnames/paths, not full URLs - the template adds "https://"
  # automatically. Any of website/linkedin/github can be omitted entirely;
  # the header lays itself out around whichever are present.
  website: jordanrivera.dev
  linkedin: linkedin.com/in/jordanrivera
  github: github.com/jrivera
  summary: >
    Backend-focused software engineer with 10+ years building and scaling
    distributed systems for consumer-facing products, from early-stage
    startups through a Series D company. Deep experience with Python and
    Go microservices, event-driven architecture, and mentoring engineers
    through their first few years. Recently led a team's migration to
    Kubernetes and built out its on-call/observability practice from
    scratch.

experience:
